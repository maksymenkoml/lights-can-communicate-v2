<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<title>Light Studio</title>
</head>
<body>
<main id="app" class="app">
<div class="scene-background"></div>
<header class="header"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><span class="app-name">Light Studio</span> <span class="room"><span id="room-name">Office</span> <span id="draft-status" class="draft-status" role="status" aria-label="Saved" data-state="pending">✓</span></span></div></header>
<svg class="stage" id="stage" viewBox="0 90 1000 740" role="group" aria-label="Light layout"></svg>
<div class="list-control"><button id="list-toggle" class="list-toggle" type="button" aria-expanded="false" aria-controls="lamp-panel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3" cy="5" r=".7"/><circle cx="3" cy="10" r=".7"/><circle cx="3" cy="15" r=".7"/></svg><span class="list-word">Lamps</span><span class="count" id="count">6</span></button></div>
<nav class="toolbar" aria-label="Tools"><button id="sync-status" class="sync-status spot-toolbar" type="button" data-level="unknown"><i></i><span>Sync status unknown</span></button><span class="tool-separator"></span><button id="sync-tool" class="tool sync-switch" type="button" aria-label="Sync with the monitor" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5" width="11" height="8" rx="1.5"/><path d="M10 13v3m-3 0h6M1.5 6.5v5m17-5v5M6 2h8"/></svg><span class="sync-word">Sync</span><span class="switch" aria-hidden="true"><i></i></span></button><span class="tool-separator"></span><button id="scene-toggle" class="tool scene-toggle" type="button" aria-label="Dark scene" aria-pressed="false"><svg class="moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16.4 11.2A7 7 0 0 1 8.8 3.6a7 7 0 1 0 7.6 7.6Z"/></svg><svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="3"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3M3.6 3.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg></button></nav>
<div class="history"><button id="undo" type="button" aria-label="Undo" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m7 4-4 4 4 4M3 8h9a5 5 0 0 1 0 10" transform="translate(0 -2)"/></svg></button><button id="redo" type="button" aria-label="Redo" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m13 4 4 4-4 4m4-4H8a5 5 0 0 0 0 10" transform="translate(0 -2)"/></svg></button></div>
<div id="lamp-panel" class="lamp-panel" aria-label="Lamps" hidden></div>
<div id="placement-hint" class="placement-hint" hidden></div>
<div id="object-menu" class="object-menu" role="menu" hidden></div>
<div id="empty-room" class="empty-room" hidden><p>No lamps in the room</p><button id="empty-add" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4v12M4 10h12"/></svg>Add lamps</button></div>
<div class="toast" id="toast" role="status"></div>
</main>
<div id="ui-tooltip" class="ui-tooltip" role="tooltip" hidden></div>
<script src="/app.js"></script>
</body>
</html>

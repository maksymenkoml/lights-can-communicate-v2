services:
  bridge:
    image: diyhue/core@sha256:392c1c39a5b46168d1d6d8582abd266586bdd45d61fb3459fa95821c710ffcba
    container_name: tmp_smart_lighting_hue_probe
    restart: "no"
    entrypoint: ["python3", "-u", "/probe/bootstrap.py", "--docker"]
    environment:
      IP: "${PROBE_IP:?Set the LAN address of the test host}"
      MAC: "${PROBE_MAC:?Set the MAC of the test host}"
      CONFIG_PATH: /opt/hue-emulator/config
      DEBUG: "false"
      TZ: America/Toronto
      PROBE_LIVE_OUTPUT: "${PROBE_LIVE_OUTPUT:-false}"
      PROBE_ADAPTER_URL: "${PROBE_ADAPTER_URL:-http://host.docker.internal:19880}"
      PROBE_HUE_STRIP: "${PROBE_HUE_STRIP:-false}"
      PROBE_HUE_PLAY: "${PROBE_HUE_PLAY:-false}"
      PROBE_ENTERTAINMENT: "${PROBE_ENTERTAINMENT:-false}"
      PROBE_GOVEE_GRADIENT: "${PROBE_GOVEE_GRADIENT:-false}"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "1900:1900/udp"
      - "2100:2100/udp"
    volumes:
      - ./state:/opt/hue-emulator/config
      - ./bootstrap.py:/probe/bootstrap.py:ro
      - ./bridge_output.py:/probe/bridge_output.py:ro
      - ./entertainment_stream.py:/probe/entertainment_stream.py:ro
      - ./entertainment_receiver.py:/probe/entertainment_receiver.py:ro
      - ./gradient_profile.py:/probe/gradient_profile.py:ro
    networks:
      - probe
networks:
  probe: {}

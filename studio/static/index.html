<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<title>Light Studio</title>
</head>
<body>
<main id="app" class="app room-pending">
<div class="scene-background"></div>
<header class="header"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><span class="brand-line"><span class="app-name">Light Studio</span> <span id="draft-status" class="draft-status" role="status" aria-label="Saved" data-state="pending">✓</span></span><a class="byline" href="https://github.com/maksymenkoml" target="_blank" rel="noopener">by Mykola Maksymenko</a></div><div class="room"><button id="room-switch" class="room-switch" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="room-cards"><svg class="room-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9 10 3.5 16.5 9"/><path d="M5 8v8.5h10V8"/></svg><span id="room-name">Office</span><span id="room-box" class="room-box" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="14" height="6.5" rx="1.6"/><path d="M6 10.2h.01M14 10.2h2"/></svg></span><svg class="room-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></button></div></header>
<svg class="stage" id="stage" viewBox="0 90 1000 740" role="group" aria-label="Light layout"></svg>
<div class="list-control"><button id="list-toggle" class="list-toggle" type="button" aria-expanded="false" aria-controls="lamp-panel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3" cy="5" r=".7"/><circle cx="3" cy="10" r=".7"/><circle cx="3" cy="15" r=".7"/></svg><span class="list-word">Objects</span><span class="count" id="count">6</span></button></div>
<section id="sync-box" class="box-corner sync-bar" aria-label="Sync"><div class="box-bar"><button id="sync-status" class="sync-status" type="button" data-level="unknown" aria-haspopup="true" aria-expanded="false"><i></i><span>Sync status unknown</span></button><span class="box-act"></span></div><div class="sync-pop"><div id="box-card" class="box-body" hidden></div><p class="box-said" role="status" hidden></p></div></section>
<div class="history"><button id="undo" type="button" aria-label="Undo" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m7 4-4 4 4 4M3 8h9a5 5 0 0 1 0 10" transform="translate(0 -2)"/></svg></button><button id="redo" type="button" aria-label="Redo" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m13 4 4 4-4 4m4-4H8a5 5 0 0 0 0 10" transform="translate(0 -2)"/></svg></button></div>
<div id="room-cards" class="room-cards" role="dialog" aria-label="Rooms" hidden></div>
<div id="lamp-panel" class="lamp-panel" aria-label="Objects" hidden></div>
<div id="placement-hint" class="placement-hint" hidden></div>
<div id="object-menu" class="object-menu" role="menu" hidden></div>
<div id="empty-room" class="empty-room" hidden><p>No lamps in the room</p><button id="empty-add" class="btn primary" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4v12M4 10h12"/></svg>Add lamps</button></div>
<div class="toast" id="toast" role="status"></div>
</main>
<div id="ui-tooltip" class="ui-tooltip" role="tooltip" hidden></div>
<script src="/app.js"></script>
</body>
</html>

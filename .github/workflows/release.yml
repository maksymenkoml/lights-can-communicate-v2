name: Release image

# A version tag (v<version>) publishes the core image for amd64 and arm64.
# Tags are created only with the owner's approval of that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag points at a reviewed commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag names the core version
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('lights_can_communicate_v2_core/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the image before publishing
        run: |
          docker build -t lights-can-communicate-v2:check .
          sh scripts/check-container-image.sh lights-can-communicate-v2:check
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

  github-release:
    name: Publish release page
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Homebridge plugin package goes with the image: the plugin and the
      # core speak one /homekit API version and are updated together.
      - name: Build the plugin package
        run: python3 -B -m lights_can_communicate_v2_core.dist --output "$RUNNER_TEMP/release"
      - name: Create the release with the plugin package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}\`. Install and update: see README, Install on a Synology NAS." \
            "$RUNNER_TEMP"/release/plugin/*.tgz
